name: Build & Sign G-TRAMS Android Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Origin URL'
        required: false
        default: 'https://g-trams-web2.onrender.com'

jobs:
  verify-and-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter (3.38.7 stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis (0 issues required)
        run: flutter analyze

      - name: Run full Unit, Widget & E2E UAT test suite
        run: flutter test

      - name: Verify OVM / LLSA I naming guardrail (zero user-facing legacy strings)
        run: |
          if grep -rnI --include="*.dart" -E '"[^"]*BPLO[^"]*"' lib/features/ lib/shared/; then
            echo "::error::User-facing legacy office acronym found in UI layer. Use 'OVM — LLSA I' instead."
            exit 1
          fi
          echo "OVM — LLSA I UI naming check passed."

      - name: Decode Android Release Signing Keystore (when configured)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 --decode > android/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')" \
              "$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')" \
              "$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')" \
              > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Production release keystore configured."
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Production signing secrets are required for version tags."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release keystore secrets are not configured. Building with debug fallback signing for preview testing."
          fi

      - name: Build Android APK (arm64-v8a + armeabi-v7a)
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'https://g-trams-web2.onrender.com' }}
          GTRAMS_ALLOW_DEBUG_SIGNING: ${{ steps.signing.outputs.signed == 'false' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Verify version-tag APK signer
        id: verify-signer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_FINGERPRINT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          expected="$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Set ANDROID_RELEASE_CERT_SHA256 to the official signing certificate's SHA-256 fingerprint."
            exit 1
          fi
          apksigner="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          signer_info="$("$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          actual="$(printf '%s\n' "$signer_info" | sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([a-fA-F0-9]+)$/\1/p' | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The APK signer does not match the official release certificate."
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Stage APK & SHA-256 Checksum
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p release-dist
          if [[ "$SIGNED" == true ]]; then
            apk_name=gtrams-mobile-release.apk
          else
            apk_name=gtrams-mobile-preview.apk
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "release-dist/$apk_name"
          (cd release-dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-dist/
          cat release-dist/SHA256SUMS.txt

      - name: Clean temporary keystore files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.signed == 'true' && 'gtrams-mobile-release-apk' || 'gtrams-mobile-preview-apk' }}
          path: release-dist/*
          retention-days: 30

      - name: Publish GitHub Release on version tag (v*)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.verify-signer.outputs.verified == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/gtrams-mobile-release.apk
            release-dist/SHA256SUMS.txt
          generate_release_notes: true
